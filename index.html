<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">

    <meta name="theme-color" content="#07090d">
    <meta name="description"
        content="Tic Tac Toe Arena — a premium browser Tic Tac Toe game with seven modes, a genuinely challenging AI, and full progression. Free to play.">

    <meta property="og:title" content="Tic Tac Toe Arena">
    <meta property="og:description"
        content="Seven game modes. Four AI difficulties. One arena. Can you beat Impossible?">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary">

    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <title>Tic Tac Toe Arena</title>

    <link rel="stylesheet" href="style.css">

    <!--
        NOTE (build system): platform SDK scripts are injected here
        per build target. The web build loads nothing extra.
    -->

</head>

<body>

    <!-- LOADING SCREEN -->

    <div id="loadingScreen" class="loading-screen">

        <div class="loading-content">

            <div class="loading-logo-glow">
                <picture>
                    <source srcset="assets/logo-512.webp" type="image/webp">
                    <img class="loading-logo" src="assets/logo-512.png" alt="Tic Tac Toe Arena logo" width="512"
                        height="512">
                </picture>
            </div>

            <div class="loading-line">
                <span></span>
            </div>

            <p>Preparing the arena</p>

        </div>

    </div>


    <!-- APPLICATION -->

    <main id="app" style="display: none;">

        <!-- ================================================ -->
        <!-- LOBBY                                            -->
        <!-- ================================================ -->

        <section id="menu" class="screen lobby-screen">

            <div class="lobby-content">

                <header class="lobby-top">

                    <div class="lobby-progress">

                        <span id="levelBadge" class="level-badge">
                            LV 1 · Rookie
                        </span>

                        <div class="xp-strip">
                            <div class="xp-bar">
                                <div id="xpFill" class="xp-fill"></div>
                            </div>
                            <span id="xpText" class="xp-text">
                                0 XP
                            </span>
                        </div>

                    </div>

                    <button id="fullscreenBtn" class="utility-button" type="button"
                        aria-label="Toggle fullscreen">⛶</button>

                </header>


                <div class="lobby-hero">

                    <picture>
                        <source srcset="assets/mark-256.webp" type="image/webp">
                        <img class="lobby-mark" src="assets/mark-256.png" alt="Tic Tac Toe Arena emblem" width="256"
                            height="256">
                    </picture>

                    <div class="lobby-title">

                        <span class="lobby-brand-small">
                            TIC TAC TOE
                        </span>

                        <h1>
                            ARENA
                        </h1>

                        <p class="lobby-tagline">
                            Seven modes. One grid. Prove it.
                        </p>

                    </div>

                </div>


                <div class="lobby-actions">

                    <button id="playNowBtn" class="play-button" type="button">
                        <span class="play-button-x">✕</span>
                        <span class="play-button-label">
                            PLAY
                            <small id="playNowHint">vs AI · Medium</small>
                        </span>
                        <span class="play-button-o">◯</span>
                    </button>


                    <div class="lobby-secondary">

                        <button id="modesBtn" class="secondary-action" type="button">
                            <span class="secondary-icon">◈</span>
                            <span>Modes</span>
                        </button>

                        <button id="statsBtn" class="secondary-action" type="button">
                            <span class="secondary-icon">▤</span>
                            <span>Stats</span>
                        </button>

                        <button id="settingsBtn" class="secondary-action" type="button">
                            <span class="secondary-icon">⚙</span>
                            <span>Settings</span>
                        </button>

                    </div>

                </div>


                <footer class="lobby-footer">

                    <span>TIC TAC TOE ARENA</span>
                    <span>v3.2</span>

                </footer>

            </div>

        </section>


        <!-- ================================================ -->
        <!-- MODE SELECTION                                   -->
        <!-- ================================================ -->

        <section id="modeSelect" class="screen modes-screen" style="display: none;">

            <div class="modes-content">

                <header class="modes-header">

                    <button id="modesBack" class="utility-button" type="button" aria-label="Back to lobby">←</button>

                    <div class="modes-heading">

                        <span class="eyebrow">
                            SELECT MODE
                        </span>

                        <h2>
                            Pick your arena
                        </h2>

                    </div>

                </header>


                <div class="mode-grid" id="modeGrid">

                    <button id="modeClassicAi" class="mode-card mode-recommended" data-accent="ai" type="button">

                        <span class="mode-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="3" width="7" height="7" rx="1.5" />
                                <rect x="14" y="3" width="7" height="7" rx="1.5" />
                                <rect x="3" y="14" width="7" height="7" rx="1.5" />
                                <circle cx="17.5" cy="17.5" r="3.2" />
                            </svg>
                        </span>

                        <span class="mode-body">
                            <strong>Play vs AI</strong>
                            <small>Classic duel · four difficulties</small>
                        </span>

                        <span class="mode-badge">Recommended</span>

                    </button>


                    <button id="modeClassicLocal" class="mode-card" data-accent="local" type="button">

                        <span class="mode-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="8" cy="8" r="3.5" />
                                <path d="M3 19c0-3 2.2-5 5-5s5 2 5 5" />
                                <circle cx="16" cy="8" r="3.5" />
                                <path d="M11 19c0-3 2.2-5 5-5s5 2 5 5" />
                            </svg>
                        </span>

                        <span class="mode-body">
                            <strong>Local Multiplayer</strong>
                            <small>Two players · one device</small>
                        </span>

                    </button>


                    <button id="modeStreak" class="mode-card" data-accent="streak" type="button">

                        <span class="mode-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path
                                    d="M13 2c1 4-2 5-2 8a4 4 0 0 0 8 1c2 3 0 9-5 10C9 22 5 19 5 14c0-4 3-5 4-8 1 2 3 2 4-4z" />
                            </svg>
                        </span>

                        <span class="mode-body">
                            <strong>Endless Streak</strong>
                            <small>One loss ends the run</small>
                        </span>

                    </button>


                    <button id="modeTimed" class="mode-card" data-accent="timed" type="button">

                        <span class="mode-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="13" r="8" />
                                <path d="M12 9v4l3 2M9 2h6" />
                            </svg>
                        </span>

                        <span class="mode-body">
                            <strong>Timed Challenge</strong>
                            <small>Five seconds per move</small>
                        </span>

                    </button>


                    <button id="modeChallenge" class="mode-card" data-accent="challenge" type="button">

                        <span class="mode-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M12 2l2.4 5.6L20 9l-5.6 1.4L12 16l-2.4-5.6L4 9l5.6-1.4z" />
                                <path d="M19 15l1 2.4L22 18l-2 1-1 2.4L18 19l-2-1 2-1.4z" />
                            </svg>
                        </span>

                        <span class="mode-body">
                            <strong>Challenge</strong>
                            <small>10 tactical puzzles</small>
                        </span>

                    </button>


                    <button id="modeTournament" class="mode-card" data-accent="tournament" type="button">

                        <span class="mode-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M7 4h10v4a5 5 0 0 1-10 0zM5 5H3v2a3 3 0 0 0 3 3M19 5h2v2a3 3 0 0 1-3 3" />
                                <path d="M12 14v3M8 21h8M10 17h4" />
                            </svg>
                        </span>

                        <span class="mode-body">
                            <strong>Tournament</strong>
                            <small>Best of five</small>
                        </span>

                    </button>


                    <button id="modeDaily" class="mode-card" data-accent="daily" type="button">

                        <span class="mode-icon">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="16" rx="2" />
                                <path d="M3 9h18M8 3v4M16 3v4" />
                                <circle cx="12" cy="15" r="2.4" />
                            </svg>
                        </span>

                        <span class="mode-body">
                            <strong>Daily Challenge</strong>
                            <small>A new puzzle every day</small>
                        </span>

                    </button>

                </div>


                <!-- DIFFICULTY PICKER (shown for AI modes) -->

                <div id="menuDifficulty" class="difficulty-picker" style="display: none;">

                    <div class="difficulty-picker-header">

                        <button
                            id="backToModes"
                            class="utility-button"
                            type="button"
                            aria-label="Back to modes"
                        >←</button>

                        <h3>
                            Select difficulty
                        </h3>

                    </div>

                    <div class="difficulty-row">

                        <button
                            id="diffEasy"
                            class="difficulty-chip"
                            type="button"
                        >
                            <strong>Easy</strong>
                            <small>Forgiving</small>
                        </button>

                        <button
                            id="diffMedium"
                            class="difficulty-chip"
                            type="button"
                        >
                            <strong>Medium</strong>
                            <small>Balanced</small>
                        </button>

                        <button
                            id="diffHard"
                            class="difficulty-chip"
                            type="button"
                        >
                            <strong>Hard</strong>
                            <small>Sharp</small>
                        </button>

                        <button
                            id="diffImpossible"
                            class="difficulty-chip difficulty-chip-impossible"
                            type="button"
                        >
                            <strong>Impossible</strong>
                            <small>Never loses</small>
                        </button>

                    </div>

                </div>

            </div>

        </section>


        <!-- ================================================ -->
        <!-- GAMEPLAY                                         -->
        <!-- ================================================ -->

        <section id="game" class="screen game-screen" style="display: none;">

            <div class="game-shell">

                <!-- TOP BAR -->

                <header class="game-topbar">

                    <button id="homeBtn" class="utility-button" type="button" aria-label="Return to lobby">←</button>


                    <div class="match-info">

                        <span id="modeTitle">
                            PLAY VS AI
                        </span>

                        <strong id="difficultyTitle">
                            MEDIUM
                        </strong>

                    </div>


                    <button id="soundBtn" class="utility-button" type="button" aria-label="Toggle sound">
                        <span id="soundIcon">🔊</span>
                    </button>

                </header>


                <!-- PLAYER IDENTITIES + TURN -->

                <div class="match-strip">

                    <div class="player-card player-x">

                        <span class="player-mark-x">✕</span>

                        <div class="player-meta">

                            <strong id="playerXName">YOU</strong>
                            <span id="xScore">0</span>

                        </div>

                    </div>


                    <div class="turn-block">

                        <span id="turnIndicator" class="turn-dot turn-x"></span>

                        <span class="status-label" id="statusLabel">
                            CURRENT TURN
                        </span>

                        <h2 id="status">
                            Your Turn
                        </h2>

                    </div>


                    <div class="player-card player-o">

                        <span class="player-mark-o">◯</span>

                        <div class="player-meta">

                            <strong id="playerOName">AI</strong>
                            <span id="oScore">0</span>

                        </div>

                    </div>

                </div>


                <!-- DRAW SCORE -->

                <div class="draw-strip">

                    <span>DRAWS</span>
                    <strong id="drawScore">0</strong>

                </div>


                <!-- TIMER (timed mode) -->

                <div id="timerWrap" class="timer-wrap" style="display: none;">

                    <div class="timer-track">
                        <div id="timerBar" class="timer-bar"></div>
                    </div>

                </div>


                <!-- BOARD -->

                <div class="board-wrapper">

                    <div class="board" id="board">
                        <!-- cells injected by board.js -->
                    </div>

                </div>


                <!-- CONTROLS -->

                <div class="game-controls">

                    <button id="restartBtn" class="secondary-control" type="button">
                        ↻ Restart
                    </button>

                    <button id="homeBtnGame" class="secondary-control" type="button">
                        ⌂ Home
                    </button>

                </div>

            </div>

        </section>

    </main>


    <!-- RESULT BANNER -->

    <div id="gameOverlay" class="game-overlay">

        <div class="overlay-card">

            <h2 id="overlayTitle">
                You Win!
            </h2>

            <p id="overlaySub">
            </p>

            <div class="overlay-actions">

                <button id="overlayPrimary" class="primary-control" type="button">
                    Rematch
                </button>

                <button id="overlaySecondary" class="secondary-control" type="button">
                    Change Mode
                </button>

                <button id="overlayTertiary" class="secondary-control" type="button">
                    Home
                </button>

            </div>

        </div>

    </div>


    <!-- SETTINGS PANEL -->

    <div id="settingsPanel" class="side-panel">
    </div>


    <!-- STATS PANEL -->

    <div id="statsPanel" class="side-panel">
    </div>


    <!-- TOAST -->

    <div id="toast" class="toast">
    </div>


    <script type="module" src="src/main.js"></script>

</body>

</html>
